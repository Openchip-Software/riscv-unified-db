# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vslidedown.vi
long_name: "Vector slide down with immediate"
description: |
  Slides elements in vector register vs2 down by 1 position, inserting immediate value at the top, and stores results in vector register vd, using vector mask vm.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, imm, vm
encoding:
  match: 001111-----------011-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  U32 sew = state.sew;
  XReg offset = imm;
  XReg vlmax = vreg_vlmax();
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vreg_mask_active(vm, i)) {
      # source elements at or above VLMAX read as zero
      if ((offset < vlmax) && (i < vlmax - offset)) {
        vreg_write_elem(sew, i, vd, vreg_read_elem(sew, i + offset, vs2));
      } else {
        vreg_write_elem(sew, i, vd, 0);
      }
    }
  }
  CSR[vstart].VALUE = 0;
