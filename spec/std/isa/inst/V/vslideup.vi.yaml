# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vslideup.vi
long_name: "Vector slide up with immediate"
description: |
  Slides elements in vector register vs2 up by 1 position, inserting immediate value at the bottom, and stores results in vector register vd, using vector mask vm.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, imm, vm
encoding:
  match: 001110-----------011-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  U32 sew = state.sew;
  XReg offset = imm;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    # elements below the offset are unchanged
    if ((i >= offset) && vreg_mask_active(vm, i)) {
      vreg_write_elem(sew, i, vd, vreg_read_elem(sew, i - offset, vs2));
    }
  }
  CSR[vstart].VALUE = 0;
