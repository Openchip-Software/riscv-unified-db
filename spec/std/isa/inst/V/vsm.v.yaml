# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsm.v
long_name: Vector store mask
description: |
  Stores a vector mask from vector register vs2 to memory starting at address in xs1 register. This operation is used to save vector masks for later restoration.
definedBy:
  extension:
    name: Zvl32b
assembly: vs3, (xs1)
encoding:
  match: 000000101011-----000-----0100111
  variables:
    - name: xs1
      location: 19-15
    - name: vs3
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  # the mask occupies ceil(vl / 8) bytes, stored with EEW = 8
  XReg virtual_address = X[xs1];
  U32 nbytes = (CSR[vl].VALUE + 7) / 8;
  for (U32 i = CSR[vstart].VALUE; i < nbytes; i++) {
    write_memory(8, virtual_address + i, vreg_read_elem(8, i, vs3)[7:0], $encoding);
  }
  CSR[vstart].VALUE = 0;
