# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vlm.v
long_name: Vector load mask
description: |
  Loads a vector mask from memory starting at address in xs1 register and stores it in vector register vd. This operation is used to load previously saved vector masks.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1)
encoding:
  match: 000000101011-----000-----0000111
  variables:
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  # the mask occupies ceil(vl / 8) bytes, loaded with EEW = 8
  XReg virtual_address = X[xs1];
  U32 nbytes = (CSR[vl].VALUE + 7) / 8;
  for (U32 i = CSR[vstart].VALUE; i < nbytes; i++) {
    vreg_write_elem(8, i, vd, read_memory(8, virtual_address + i, $encoding));
  }
  CSR[vstart].VALUE = 0;
