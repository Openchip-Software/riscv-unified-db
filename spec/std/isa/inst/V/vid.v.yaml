# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vid.v
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vm
encoding:
  match: 010100-0000010001010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  U32 sew = state.sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vreg_mask_active(vm, i)) {
      vreg_write_elem(sew, i, vd, vreg_trunc(sew, i));
    }
  }
  CSR[vstart].VALUE = 0;
