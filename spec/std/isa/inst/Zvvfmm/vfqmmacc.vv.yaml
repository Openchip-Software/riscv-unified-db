# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfqmmacc.vv
long_name: Floating-Point Quad-Widening Matrix Multiply-Accumulate
description: |
  Interpreting `vs1` as A~tile~ and `vs2` as
  B~tile~^T^, the instruction computes

  T = A~tile~ × B~tile~^T^

  and accumulates T into `vd`: C ← C + T,
  with a widening factor of 4 applied to the K dimension.

  `vs1` is interpreted as the M × K~eff~ tile A~tile~ in row-major register layout, and `vs2` is interpreted as the K~eff~ × N tile B~tile~^T^ in column-major register layout,
  and `vd` as an M×M physical accumulator tile (row-major register
  layout), of which only the first N columns are active.
  `vs1` and `vs2` have elements of width SEW÷4; `vd` has elements of width SEW.

  K_effective = LAMBDA × 4 × LMUL.
  `VL` selects how many columns of B~tile~^T^, and therefore how many columns of C, are active; VL must be a multiple of LAMBDA × LMUL.
  The remaining columns of the physical C tile are C tile tail elements.
  The floating-point format for A and B elements is selected independently by
  `altfmt_A` and `altfmt_B`, interpreted for input element width SEW÷4; the C
  format is selected by `altfmt`, interpreted for width SEW.
  Final accumulation into the C accumulator format uses the dynamic rounding mode from `frm`.
  Any intermediate grouping, partial-sum formation, and optional rounding of partial sums follow the floating-point accumulation and rounding model of the Zvvm specification.
  Floating-point exception flags accumulate in `fflags`.

  When `vm=0` (`v0.scale`), the register `v0` supplies paired block-scale
  factors for microscaling; the scale format is determined by the input data
  type (see the microscaling section of the Zvvm specification). The `bs` field in `vtype`
  selects the block size (32 or 16 elements).
  Only `SEW ∈ {16, 32, 64}` is valid, giving
  `EEW = SEW ÷ 4 ∈ {4, 8, 16}`.
  `SEW = 8`, which would imply `EEW = 2`, is _reserved_.

  _Illegal Instruction_ is raised if any of the following conditions hold:

  * `vstart` ≠ 0.
  * `frm` holds a reserved rounding mode (5, 6 or 7).
  * `SEW = 8` (`EEW = SEW ÷ 4 = 2` is reserved).
  * VL is not a multiple of LAMBDA × LMUL.
  * EMUL_C (= VLEN ÷ (SEW × LAMBDA²)) is not in \{1, 2, 4, 8, 16}.
  * `vs1` or `vs2` is not aligned for LMUL.
  * `vd` is not aligned for EMUL_C.
  * The `vd` register group overlaps the `vs1` or `vs2` register group.
  * When `vm=0`: the selected MX cell in the floating-point encoding map is `—` or `_reserved_`, or any required extension named by that cell is not implemented.
  * When `vm=0`: SEW × LAMBDA < 16.
  * When `vm=0` and `bs=1`: W × LMUL > SEW.
  * When `vm=0`: `vd`, `vs1`, or `vs2` overlaps `v0`.
  * When `vm=1`: the selected row in the floating-point encoding map is marked `_reserved_`, or any extension named by that row is not implemented.
definedBy:
  extension:
    name: Zvvfmm
assembly: vd, vs1, vs2, vm
encoding:
  match: 010110-----------001-----1010111
  variables:
    - name: vm
      location: 25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  if (CSR[vstart].VALUE != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  check_f_ok($encoding);
  ZvvmGemmGeom g = zvvm_decode_gemm_geometry(4, $encoding);
  if (vm == 0) {
    zvvm_check_microscaling(g, vs1, vs2, vd, $encoding);
    if (!zvvm_fp_mx_encoding_legal?(g.w, g.eew_c, CSR[vtype].ALTFMTA, CSR[vtype].ALTFMTB, CSR[vtype].ALTFMT, CSR[vtype].BS)) {
      raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
    }
  } else if (!zvvm_fp_encoding_legal?(g.w, g.eew_c, CSR[vtype].ALTFMTA, CSR[vtype].ALTFMTB, CSR[vtype].ALTFMT)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  zvvm_check_gemm_reg_groups(g, vs1, vs2, vd, $encoding);
  ZvvmFpFmt fmt_a = zvvm_fp_format_of(g.eew_a, CSR[vtype].ALTFMTA);
  ZvvmFpFmt fmt_b = zvvm_fp_format_of(g.eew_a, CSR[vtype].ALTFMTB);
  ZvvmFpFmt fmt_c = zvvm_fp_format_of(g.eew_c, CSR[vtype].ALTFMT);
  RoundingMode rm = zvvm_fp_rounding_mode($encoding);
  if (vm == 0) {
    zvvm_fp_scaled_gemm(g, fmt_a, fmt_b, fmt_c, rm, vs1, vs2, vd, $encoding);
  } else {
    zvvm_fp_gemm(g, fmt_a, fmt_b, fmt_c, rm, vs1, vs2, vd, $encoding);
  }
