kind: extension
name: Zvvofp4ofp8mm
long_name: Matrix multiply-accumulate, OFP4 (E2M1) inputs, OFP8 accumulator
description: |
  Enables the `vfwmmacc.vv` (W=2, SEW=8) encodings with
  OFP4 (E2M1) A and B input elements and OFP8 C accumulator
  elements. The floating-point encoding map of the Zvvm specification names this
  extension in the rows that it makes legal.

  Rows that mix two input formats name more than one extension and require
  all of them.
