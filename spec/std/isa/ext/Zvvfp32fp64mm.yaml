$schema: "ext_schema.json#"
kind: extension
name: Zvvfp32fp64mm
long_name: Matrix multiply-accumulate, IEEE binary32 inputs, IEEE binary64 accumulator
description: |
  Enables the `vfwmmacc.vv` (W=2, SEW=64) encodings with
  IEEE binary32 A and B input elements and IEEE binary64 C accumulator
  elements. The floating-point encoding map of the Zvvm specification names this
  extension in the rows that it makes legal.

  Rows that mix two input formats name more than one extension and require
  all of them.
type: unprivileged
