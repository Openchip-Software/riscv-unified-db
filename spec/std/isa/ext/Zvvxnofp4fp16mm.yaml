kind: extension
name: Zvvxnofp4fp16mm
long_name: Microscaled matrix multiply-accumulate, MXFP4 inputs, IEEE binary16 accumulator, block size 16
description: |
  Enables the `vm=0` (`v0.scale`) encodings of `vfqmmacc.vv` (W=4,
  SEW=16) for E8M0-scaled MXFP4 A and B input elements and
  IEEE binary16 C accumulator elements, with block size 16
  (`vtype.bs` = 1).
  The floating-point encoding map of the Zvvm specification names this
  extension in the block-size cells that it makes legal.

  With block size 16, the instruction raises an illegal-instruction exception
  unless W × LMUL ≤ SEW.

  Zvvxnofp4fp16mm implies Zvvxofp4fp16mm.
type: unprivileged
