$schema: "ext_schema.json#"
kind: extension
name: Zvvfp16mm
long_name: Matrix multiply-accumulate, IEEE binary16 inputs, IEEE binary16 accumulator
description: |
  Enables the `vfmmacc.vv` (W=1, SEW=16) encodings with
  IEEE binary16 A and B input elements and IEEE binary16 C accumulator
  elements. The floating-point encoding map of the Zvvm specification names this
  extension in the rows that it makes legal.

  Rows that mix two input formats name more than one extension and require
  all of them.
type: unprivileged
