kind: extension
name: Zvvbf16mm
long_name: Matrix multiply-accumulate, BFloat16 inputs, BFloat16 accumulator
description: |
  Enables the `vfmmacc.vv` (W=1, SEW=16) encodings with
  BFloat16 A and B input elements and BFloat16 C accumulator
  elements. The floating-point encoding map of the Zvvm specification names this
  extension in the rows that it makes legal.

  Rows that mix two input formats name more than one extension and require
  all of them.
