kind: extension
name: Zvvi64mm
long_name: Matrix multiply-accumulate, [U]Int64 inputs, Int64 accumulator
description: |
  Enables the `vmmacc.vv` (W=1, SEW=64) encodings with
  [U]Int64 A and B input elements and Int64 C accumulator
  elements. The integer encoding map of the Zvvm specification names this
  extension in the rows that it makes legal.

  `vtype.altfmt_A` and `vtype.altfmt_B` select signed (0) or unsigned (1)
  interpretation of the A and B inputs. The accumulator is signed.
