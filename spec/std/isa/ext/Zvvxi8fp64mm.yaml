$schema: "ext_schema.json#"
kind: extension
name: Zvvxi8fp64mm
long_name: Microscaled matrix multiply-accumulate, MXINT8 inputs, IEEE binary64 accumulator, block size 32
description: |
  Enables the `vm=0` (`v0.scale`) encodings of `vf8wimmacc.vv` (W=8,
  SEW=64) for E8M0-scaled MXINT8 A and B input elements and
  IEEE binary64 C accumulator elements, with block size 32
  (`vtype.bs` = 0).
  The integer MX encoding map of the Zvvm specification names this
  extension in the block-size cells that it makes legal.

  The integer-input microscaling extensions imply no other extension.
  `vf8wimmacc.vv` has no unscaled form; its `vm=1` encoding is the integer
  instruction of Zvvmm.
type: unprivileged
versions:
